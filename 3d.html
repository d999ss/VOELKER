<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3986 Voelker Ct — 3D Model</title>
<style>
:root{--gold:#D2A62C;--bg:#111119;--muted:#777;--line:#333}
*{box-sizing:border-box} html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:#aaa;font-family:"Courier New",monospace}
#app{position:fixed;inset:0} canvas{display:block;width:100%;height:100%;touch-action:none}
header{position:fixed;z-index:4;top:0;left:0;right:0;padding:20px 16px 10px;text-align:center;pointer-events:none;background:linear-gradient(#111119e8,#11111900)}
h1{margin:0;color:var(--gold);font-size:17px;letter-spacing:4px;text-transform:uppercase;font-weight:bold}
.controls{position:fixed;z-index:5;top:58px;left:0;right:0;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;padding:8px 12px;pointer-events:none}
button,.back{pointer-events:auto;background:#111119b8;border:1px solid var(--line);color:#888;padding:6px 12px;font:10px/1 "Courier New",monospace;letter-spacing:1px;text-decoration:none;cursor:pointer;transition:.15s}
button:hover,.back:hover{border-color:#666;color:#ccc} button.on{border-color:var(--gold);color:var(--gold)}
.back{position:fixed;z-index:5;left:14px;bottom:14px}.hint{position:fixed;z-index:4;right:14px;bottom:16px;color:#555;font-size:9px;letter-spacing:1px;pointer-events:none}
@media(max-width:620px){header{padding-top:14px}h1{font-size:12px;letter-spacing:2px}.controls{top:43px;gap:5px;padding:7px}.controls button{font-size:8px;padding:5px 8px}.hint{display:none}.back{font-size:8px;padding:5px 8px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app"></div>
<header><h1>3986 Voelker Ct — 3D Model</h1></header>
<div class="controls">
  <button class="on" data-mode="exterior">Exterior</button>
  <button data-mode="dollhouse">Dollhouse</button>
  <button id="garage">Garage X-Ray</button>
  <button id="rotate">Auto-Rotate</button>
</div>
<a class="back" href="index.html">← Floor Plans</a><div class="hint">DRAG TO ORBIT · SCROLL TO ZOOM</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x111119);
scene.fog=new THREE.Fog(0x111119,105,185);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,300);
camera.position.set(76,55,91);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.1;
document.querySelector('#app').appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement); controls.target.set(25,8,31); controls.enableDamping=true; controls.dampingFactor=.06; controls.minDistance=35; controls.maxDistance=150; controls.maxPolarAngle=Math.PI*.48;
scene.add(new THREE.HemisphereLight(0xbfd8ff,0x29251f,1.6));
const sun=new THREE.DirectionalLight(0xfff0d6,3); sun.position.set(-32,62,54); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048); sun.shadow.camera.left=-80; sun.shadow.camera.right=80; sun.shadow.camera.top=80; sun.shadow.camera.bottom=-80; scene.add(sun);

function canvasTexture(kind){
  const c=document.createElement('canvas'); c.width=c.height=256; const x=c.getContext('2d');
  if(kind==='siding'){
    x.fillStyle='#4a4d52';x.fillRect(0,0,256,256);
    for(let y=7;y<256;y+=14){x.fillStyle='rgba(25,27,30,.38)';x.fillRect(0,y,256,2);x.fillStyle='rgba(255,255,255,.035)';x.fillRect(0,y+2,256,1)}
  }else if(kind==='stone'){
    x.fillStyle='#827765';x.fillRect(0,0,256,256); let seed=91; const rnd=()=>((seed=Math.imul(seed,1664525)+1013904223>>>0)/4294967296);
    for(let i=0;i<90;i++){const px=rnd()*256,py=rnd()*256,rx=8+rnd()*18,ry=5+rnd()*10;x.beginPath();for(let p=0;p<8;p++){const a=p*Math.PI/4,r=0.78+rnd()*.25;x.lineTo(px+Math.cos(a)*rx*r,py+Math.sin(a)*ry*r)}x.closePath();x.fillStyle=['#9b8c72','#b1a184','#766c5e','#a99074'][i%4];x.fill();x.strokeStyle='#4f4941';x.lineWidth=2;x.stroke()}
  }else if(kind==='roof'){
    x.fillStyle='#3a3a40';x.fillRect(0,0,256,256);for(let y=0;y<256;y+=9){x.strokeStyle='rgba(15,15,18,.45)';x.beginPath();x.moveTo(0,y);x.lineTo(256,y);x.stroke();for(let q=(y/9)%2?0:8;q<256;q+=16){x.fillStyle='rgba(255,255,255,.025)';x.fillRect(q,y+1,8,6)}}
  }else{x.fillStyle='#a9a69e';x.fillRect(0,0,256,256);for(let i=0;i<500;i++){const v=145+Math.random()*35;x.fillStyle=`rgba(${v},${v},${v},.12)`;x.fillRect(Math.random()*256,Math.random()*256,2,2)}}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(kind==='siding'?3:4,kind==='siding'?3:4);t.colorSpace=THREE.SRGBColorSpace;return t;
}
const siding=new THREE.MeshStandardMaterial({map:canvasTexture('siding'),color:0xffffff,roughness:.88});
const stone=new THREE.MeshStandardMaterial({map:canvasTexture('stone'),roughness:1});
const roofMat=new THREE.MeshStandardMaterial({map:canvasTexture('roof'),roughness:.94,color:0xffffff,side:THREE.DoubleSide});
const trim=new THREE.MeshStandardMaterial({color:0x2a2c30,roughness:.8});
const concrete=new THREE.MeshStandardMaterial({map:canvasTexture('concrete'),color:0xd2d0c8,roughness:1});
const glass=new THREE.MeshStandardMaterial({color:0x18252d,emissive:0x17242c,emissiveIntensity:.28,metalness:.25,roughness:.18});
const interiorMat=new THREE.MeshStandardMaterial({color:0xc6bfb0,roughness:.9});
const exterior=new THREE.Group(), roofs=new THREE.Group(), interiors=new THREE.Group(), labels=new THREE.Group(), garageShell=new THREE.Group(), cars=new THREE.Group(); scene.add(exterior,roofs,interiors,labels,cars);
function box(name,x,y,z,w,h,d,mat,parent=exterior,shadow=true){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.name=name;m.position.set(x+w/2,y+h/2,z+d/2);m.castShadow=shadow;m.receiveShadow=true;parent.add(m);return m}
// Exact locked L-shaped structure: main 4→46.8 / 5→36; garage 4→29.3 / 36.2→62.2.
const mainLower=box('main lower',4,0,5,42.8,9.1,31,siding);
const mainUpper=box('upper left-center',4,10.1,5,26.4,8,31,siding);
const garage=box('garage shell',4,0,36.2,25.3,9.5,26,siding,garageShell); exterior.add(garageShell);
box('driveway',29.6,-.18,36.2,20,.18,26.2,concrete);
box('front steps',25.2,0,36,6.2,.55,2.2,concrete);box('front steps',25.7,.55,35.7,5.2,.55,1.5,concrete);box('front stoop',25.9,1.1,35.4,4.8,.35,1.1,concrete);
box('back turf',-14,-.22,-39,80,.2,44,new THREE.MeshStandardMaterial({color:0x304b31,roughness:1}));
box('covered deck slab',4,-.05,-3.5,18,.3,8.5,new THREE.MeshStandardMaterial({color:0x665b4c,roughness:1}));
box('site',-45,-.42,-42,140,.2,140,new THREE.MeshStandardMaterial({color:0x272620,roughness:1}));
// Three-foot fieldstone wraps the street-facing garage, entry and living room base.
box('garage stone front',4,.05,61.98,25.3,3,.24,stone); box('living stone',31,.05,35.82,15.8,3,.25,stone); box('entry stone',24.4,.05,35.78,7,3,.27,stone);
// Openings applied as proud/recessed facade assemblies, visually covering the siding shell.
function windowFront(x,z,w,h,y=4.1){box('window trim',x-.22,y-.22,z,w+.44,h+.44,.22,trim);box('window glass',x,y,z-.03,w,h,.28,glass);for(let i=1;i<3;i++)box('mullion',x+w*i/3,y,z-.19,.09,h,.08,trim)}
windowFront(34,35.72,10.2,5.7,3.35); windowFront(8.2,35.72,5,4.5,3.7);
// Upper front three-window band.
for(let i=0;i<3;i++)windowFront(11.0+i*4.3,35.72,3.25,4.8,12.0);
// Door and sidelights at entry.
box('front door trim',25.45,1.25,35.52,4.2,7.9,.34,trim);box('front door',25.78,1.35,35.31,3.55,7.45,.35,new THREE.MeshStandardMaterial({color:0x182231,roughness:.65}));box('door lite',26.35,6.0,35.08,2.35,1.8,.1,glass);
// Back window/slider compositions and shallow kitchen bay at Z=5.
box('kitchen bay',18.5,.3,3.65,12.5,8.2,1.35,siding);box('bay glass',19.2,3.0,3.42,11.1,4.2,.2,glass);box('bedroom slider',6.0,1.2,4.72,7,7.1,.25,glass);box('dining slider',34.2,1.2,4.72,8,7.1,.25,glass);
// Garage doors are on the RIGHT/EAST wall, along Z, facing the driveway.
function garageDoor(z,d){box('garage door surround',29.16,.75,z-.16,.38,8.0,d+.32,trim);const door=box('garage door',29.38,1,z,.18,7.55,d,new THREE.MeshStandardMaterial({color:0x3f4247,roughness:.82}));for(let y=2;y<8;y+=1.4)box('recess line',29.49,y,z+.18,.05,.07,d-.36,trim)}
garageDoor(36.5,8.8); garageDoor(46.1,15.8);
// Right-side chimney chase near living room.
box('chimney',46.55,0,21.3,2.5,22,5.3,stone);box('chimney cap',46.25,21.7,21.0,3.1,.45,5.9,trim);

function roofPlane(name,w,d,material=roofMat){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),material);m.name=name;m.castShadow=true;m.receiveShadow=true;roofs.add(m);return m}
// Main gable, 6:12, ridge runs X. Eaves extend 1.5 feet on all sides.
const mainHalf=17,mainRise=8.5,slope=Math.hypot(mainHalf,mainRise),ridgeY=18.1+mainRise;
let rp=roofPlane('main south slope',45.8,slope);rp.rotation.x=Math.atan2(mainHalf,mainRise);rp.position.set(25.4,ridgeY-mainRise/2,36.5-mainHalf/2);
rp=roofPlane('main north slope',45.8,slope);rp.rotation.x=-Math.atan2(mainHalf,mainRise);rp.position.set(25.4,ridgeY-mainRise/2,3.5+mainHalf/2);
// Dominant front cross-gable over left/center upper volume, ridge projects toward street.
function crossGable(cx,width,z0,z1,eaveY){const half=width/2,rise=half*.5,len=z1-z0,sl=Math.hypot(half,rise),ang=Math.atan2(half,rise);let a=roofPlane('front gable left',len,sl);a.rotation.set(Math.PI/2,ang,Math.PI/2);a.position.set(cx-half/2,eaveY+rise/2,(z0+z1)/2);let b=roofPlane('front gable right',len,sl);b.rotation.set(Math.PI/2,-ang,Math.PI/2);b.position.set(cx+half/2,eaveY+rise/2,(z0+z1)/2)}
crossGable(17.2,21.8,21.0,39.0,18.1); crossGable(28.1,9.4,27.5,39.1,10.0);
// True hip roof over garage: ridge along Z, four planar facets and 1.5-foot eaves.
const gx0=2.5,gx1=30.8,gz0=34.7,gz1=63.7,ge=9.5,gr=16.575,rx0=gx0+14.15,rx1=gx1-14.15;
function polyRoof(points){const sh=new THREE.Shape();sh.moveTo(points[0][0],points[0][2]);for(let i=1;i<points.length;i++)sh.lineTo(points[i][0],points[i][2]);const g=new THREE.ShapeGeometry(sh);const p=new THREE.Mesh(g,roofMat);const pos=g.attributes.position;for(let i=0;i<pos.count;i++){const X=pos.getX(i),Z=pos.getY(i);let Y=ge;if(points.length===4){const near=points.reduce((a,b)=>Math.abs(b[0]-X)+Math.abs(b[2]-Z)<Math.abs(a[0]-X)+Math.abs(a[2]-Z)?b:a);Y=near[1]}pos.setXYZ(i,X,Y,Z)}g.computeVertexNormals();p.castShadow=true;p.receiveShadow=true;roofs.add(p)}
polyRoof([[gx0,ge,gz0],[rx0,gr,gz0+14.15],[rx1,gr,gz0+14.15],[gx1,ge,gz0]]);polyRoof([[gx0,ge,gz1],[gx1,ge,gz1],[rx1,gr,gz1-14.15],[rx0,gr,gz1-14.15]]);polyRoof([[gx0,ge,gz0],[gx0,ge,gz1],[rx0,gr,gz1-14.15],[rx0,gr,gz0+14.15]]);polyRoof([[gx1,ge,gz0],[rx1,gr,gz0+14.15],[rx1,gr,gz1-14.15],[gx1,ge,gz1]]);

const rooms=[['Bedroom 4',4.2,5.2,14.3,12.1],['Kitchen',18.5,5.2,12.5,20],['Dining',31,5.2,15.6,13],['Bath 3',4.2,17.3,9,5.2],['Laundry',4.2,22.5,9,5.5],['Mud',4.2,28,10,6],['Stairs',19.5,21,5,9.5],['FAU',19.5,30.5,3.5,3],['Half Bath',23,29,4,3.8],['Entry',25,31.8,6,4],['Living',31,18.2,15.6,17.6]];
function roomWalls([name,x,z,w,d]){const h=9;box(name,x,.15,z,w,.18,d,new THREE.MeshStandardMaterial({color:0x827b6d,roughness:1}),interiors);box(name+' N',x,.2,z,w,h,.4,interiorMat,interiors);box(name+' S',x,.2,z+d-.4,w,h,.4,interiorMat,interiors);box(name+' W',x,.2,z,.4,h,d,interiorMat,interiors);box(name+' E',x+w-.4,.2,z,.4,h,d,interiorMat,interiors);labels.add(labelSprite(name,x+w/2,3.6,z+d/2))}
function labelSprite(textValue,x,y,z){const c=document.createElement('canvas');c.width=512;c.height=96;const q=c.getContext('2d');q.fillStyle='rgba(17,17,25,.76)';q.fillRect(0,8,512,80);q.strokeStyle='#D2A62C';q.strokeRect(2,10,508,76);q.fillStyle='#e4d7b0';q.font='bold 29px Courier New';q.textAlign='center';q.textBaseline='middle';q.fillText(textValue.toUpperCase(),256,49);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,transparent:true}));s.position.set(x,y,z);s.scale.set(6.8,1.3,1);return s}
rooms.forEach(roomWalls); interiors.visible=labels.visible=false;
// Locked vehicle dimensions and orientations: length on X, nose toward -X.
function car(name,L,W,x,z,color,tall=2.8){const g=new THREE.Group();g.name=name;box(name+' body',x-L/2,.45,z-W/2,L,tall*.58,W,new THREE.MeshStandardMaterial({color,metalness:.42,roughness:.3}),g);box(name+' cabin',x-L*.08,tall*.58,z-W*.38,L*.46,tall*.42,W*.76,new THREE.MeshStandardMaterial({color:0x172027,metalness:.25,roughness:.16}),g);for(const xx of [x-L*.32,x+L*.32])for(const zz of [z-W*.51,z+W*.51]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.72,.72,.38,20),trim);wheel.rotation.x=Math.PI/2;wheel.position.set(xx,.72,zz);g.add(wheel)}cars.add(g)}
car('1983 911 SC',14.1,5.4,14.6,40.7,0x8f221d,2.65);car('2017 991.2 4S',14.8,6.1,14.4,50.5,0xb5b6b7,2.75);car('Mercedes G550',15.8,6.3,14.4,58.1,0x243027,5.9);cars.visible=false;

let mode='exterior',xray=false;
function setMode(next){mode=next;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));const doll=mode==='dollhouse';roofs.visible=!doll;interiors.visible=labels.visible=doll;mainUpper.visible=!doll;mainLower.material.transparent=doll;mainLower.material.opacity=doll?.18:1;controls.target.set(25,doll?3:8,31)}
function setXray(on){xray=on;document.querySelector('#garage').classList.toggle('on',on);cars.visible=on;garage.material=garage.material.clone();garage.material.transparent=on;garage.material.opacity=on?.18:1;garage.material.depthWrite=!on;roofs.children.filter(o=>o.name===''||o.name.includes('')).forEach(()=>{});}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
document.querySelector('#garage').addEventListener('click',()=>setXray(!xray));document.querySelector('#rotate').addEventListener('click',e=>{controls.autoRotate=!controls.autoRotate;controls.autoRotateSpeed=.65;e.currentTarget.classList.toggle('on',controls.autoRotate)});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script>
